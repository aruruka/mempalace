[project]
name = "mempalace"
version = "0.2.1"
description = "MemPalace v2 - SQLite hybrid retrieval memory for coding agents (FTS5 BM25 + fastembed dense + sqlite-vec KNN + RRF)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.8.0",
    "numpy>=1.26",
    "typer>=0.27.2",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.9"]
legacy = ["duckdb>=1.5.2"]

[project.scripts]
mempalace = "mempalace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mempalace"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "RUF",
    "D",
    "B",
    "A",
    "C4",
]
ignore = [
    "D100",
    "D104",
]

[tool.ruff.lint.isort]
known-first-party = ["mempalace"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-bdd>=8.1.0",
    "ruff>=0.15.11",
]
